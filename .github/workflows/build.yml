name: Build android12-5.10-lts (marble)

on:
  workflow_dispatch:

permissions:
  contents: write   # wajib agar bisa membuat Release

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      KERNEL_REPO:   "https://github.com/yudharn/Kernel-Source"
      KERNEL_BRANCH: "android12-5.10-lts"
      DEFCONFIG:     "marble_defconfig"
      DEVICE:        "marble"
      ANYKERNEL_REPO: "https://github.com/osm0sis/AnyKernel3"
      KSU_REPO:    "https://github.com/tiann/KernelSU.git"
      SUSFS_REPO:   "https://gitlab.com/simonpunk/susfs4ksu.git"
      SUSFS_BRANCH: "gki-android12-5.10"
      CLANG_URL: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183.tar.gz"

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git bc bison flex libssl-dev libelf-dev \
            lz4 lzop zstd build-essential patch diffutils cpio zip unzip kmod \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone kernel source
        run: git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel

      - name: Detect build structure
        id: detect
        run: |
          if [ -d kernel/common ] && [ -f kernel/common/Makefile ]; then
            echo "kroot=common" >> "$GITHUB_OUTPUT"
          else
            echo "kroot=." >> "$GITHUB_OUTPUT"
          fi
          if [ -f kernel/build.sh ]; then echo "has_build_sh=1" >> "$GITHUB_OUTPUT"; else echo "has_build_sh=0" >> "$GITHUB_OUTPUT"; fi

      - name: Integrate KernelSU
        run: |
          KROOT=${{ steps.detect.outputs.kroot }}
          git clone --depth=1 "$KSU_REPO" ksu-src
          ln -sfn "$GITHUB_WORKSPACE/ksu-src/kernel" "kernel/$KROOT/KernelSU"
          grep -q 'obj-y += KernelSU/' "kernel/$KROOT/Makefile" || echo 'obj-y += KernelSU/' >> "kernel/$KROOT/Makefile"
          grep -q 'source "KernelSU/Kconfig"' "kernel/$KROOT/Kconfig" || sed -i '1i source "KernelSU/Kconfig"' "kernel/$KROOT/Kconfig"
          echo "✅ KernelSU siap"

      - name: Integrate SUSFS
        run: |
          set -e
          KROOT=${{ steps.detect.outputs.kroot }}
          git clone --depth=1 -b "$SUSFS_BRANCH" "$SUSFS_REPO" susfs

          # Patch sisi KernelSU
          cp -f susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ksu-src/
          (cd ksu-src && patch -p1 --forward < 10_enable_susfs_for_ksu.patch)

          # Patch + sumber SUSFS ke kernel (nama patch yang benar untuk branch ini)
          cp -f susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch "kernel/$KROOT/"
          cp -rf susfs/kernel_patches/fs/*            "kernel/$KROOT/fs/"
          cp -rf susfs/kernel_patches/include/linux/* "kernel/$KROOT/include/linux/"
          (cd "kernel/$KROOT" && patch -p1 --forward < 50_add_susfs_in_gki-android12-5.10.patch)
          echo "✅ SUSFS siap"

      - name: Enable KernelSU + SUSFS config
        run: |
          KROOT=${{ steps.detect.outputs.kroot }}
          CFG="kernel/$KROOT/arch/arm64/configs/$DEFCONFIG"
          for opt in KSU KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_TRY_UMOUNT \
                     KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT KSU_SUSFS_SUS_KSU_MOUNTINFO \
                     KSU_SUSFS_SPOOF_PROC_CMDLINE KSU_SUSFS_ENABLE_LOG KSU_SUSFS_OPEN_REDIRECT; do
            grep -q "CONFIG_$opt=" "$CFG" || echo "CONFIG_$opt=y" >> "$CFG"
          done
          echo "✅ Config disuntik ke $CFG"

      - name: Prepare toolchain
        if: steps.detect.outputs.has_build_sh == '0'
        run: |
          mkdir -p clang
          curl -L "$CLANG_URL" | tar -xz -C clang
          echo "$PWD/clang/bin" >> "$GITHUB_PATH"

      - name: Build with build.sh
        if: steps.detect.outputs.has_build_sh == '1'
        run: |
          cd kernel
          chmod +x build.sh
          ./build.sh

      - name: Build with make
        if: steps.detect.outputs.has_build_sh == '0'
        run: |
          KROOT=${{ steps.detect.outputs.kroot }}
          cd "kernel/$KROOT"
          make O="$PWD/out" ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            "$DEFCONFIG"
          make O="$PWD/out" ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            -j"$(nproc)"

      - name: Collect build artifacts
        run: |
          mkdir -p staging
          find kernel -type f $ -name "Image" -o -name "Image.gz" $ -exec cp -v {} staging/ \;
          ls -la staging
          test -f staging/Image || test -f staging/Image.gz || { echo "❌ Image tidak ditemukan"; exit 1; }

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 "$ANYKERNEL_REPO" ak3
          cp staging/Image* ak3/ 2>/dev/null || cp staging/Image ak3/
          NAME="AnyKernel3-${DEVICE}-android12-5.10-$(date +%Y%m%d-%H%M)"
          (cd ak3 && zip -r9 "../$NAME.zip" . -x ".git/*")
          echo "ZIP_NAME=$NAME.zip" >> "$GITHUB_ENV"

      - name: Generate build info
        run: |
          {
            echo "Device     : $DEVICE (Redmi Note 12 Turbo / POCO F5)"
            echo "Kernel     : android12-5.10-lts"
            echo "Source     : $KERNEL_REPO @ $KERNEL_BRANCH"
            echo "Defconfig  : $DEFCONFIG"
            echo "KernelSU   : $(git -C ksu-src log -1 --format='%h %s')"
            echo "SUSFS      : $SUSFS_BRANCH"
            echo "Build date : $(date -u)"
          } > build-info.txt
          cat build-info.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.DEVICE }}-android12-5.10
          path: |
            *.zip
            build-info.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "android12-5.10-lts-$(date +%Y%m%d-%H%M)"
          name: "KernelSU + SUSFS | ${{ env.DEVICE }} | android12-5.10-lts"
          body_path: build-info.txt
          files: ${{ env.ZIP_NAME }}
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
