name: Build android12-5.10-lts

on:
  workflow_dispatch:   # tambah push:/schedule: kalau mau auto-build

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      # ====== WAJIB DISESUAIKAN ======
      KERNEL_REPO:   "https://github.com/yudharn/Kernel-Source"   # repo kernel kamu
      KERNEL_BRANCH: "android12-5.10-lts"
      DEFCONFIG:     "marble_defconfig"             # path defconfig di arch/arm64/configs/
      DEVICE_NAME:   "marble"
      ANYKERNEL_REPO: "https://github.com/osm0sis/AnyKernel3"                                        # isi URL repo AnyKernel3, kosongkan jika tidak pakai
      # ====== KernelSU & SUSFS (jangan diubah kecuali paham) ======
      KSU_REPO:    "https://github.com/tiann/KernelSU.git"
      KSU_BRANCH:  "main"
      SUSFS_REPO:   "https://gitlab.com/simonpunk/susfs4ksu.git"
      SUSFS_BRANCH: "gki-android12-5.10"   # branch yang benar untuk android12-5.10 (bukan master/kernel-5.10)

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f || true
          df -h

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends git ccache bc bison flex libssl-dev \
            libelf-dev lz4 zstd build-essential libncurses-dev device-tree-compiler \
            clang lld patch zip unzip gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Clone kernel source
        run: git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel

      - name: Detect build structure
        id: detect
        run: |
          cd kernel
          if [ -d common ] && [ -f common/Makefile ]; then
            echo "kroot=common" >> "$GITHUB_OUTPUT"
          else
            echo "kroot=." >> "$GITHUB_OUTPUT"
          fi
          if [ -f build.sh ]; then echo "has_build_sh=1" >> "$GITHUB_OUTPUT"; else echo "has_build_sh=0" >> "$GITHUB_OUTPUT"; fi

      - name: Integrate KernelSU
        run: |
          KROOT=${{ steps.detect.outputs.kroot }}
          git clone --depth=1 -b "$KSU_BRANCH" "$KSU_REPO" ksu-src
          ln -sfn "$GITHUB_WORKSPACE/ksu-src/kernel" "kernel/$KROOT/KernelSU"
          echo 'obj-y += KernelSU/'            >> "kernel/$KROOT/Makefile"
          echo 'source "KernelSU/Kconfig"'     >> "kernel/$KROOT/Kconfig"
          echo "✅ KernelSU siap"

      - name: Integrate SUSFS
        run: |
          set -e
          KROOT=${{ steps.detect.outputs.kroot }}
          # Branch lama (master/kernel-5.10) sudah tidak punya patch 5.10 → wajib branch ini
          git clone --depth=1 -b "$SUSFS_BRANCH" "$SUSFS_REPO" susfs

          # 1) Patch sisi KernelSU
          cp susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ksu-src/
          (cd ksu-src && patch -p1 --forward < 10_enable_susfs_for_ksu.patch)

          # 2) Patch + file sumber SUSFS ke kernel (nama patch baru!)
          cp susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch "kernel/$KROOT/"
          cp -rf susfs/kernel_patches/fs/*           "kernel/$KROOT/fs/"
          cp -rf susfs/kernel_patches/include/linux/* "kernel/$KROOT/include/linux/"
          (cd "kernel/$KROOT" && patch -p1 --forward < 50_add_susfs_in_gki-android12-5.10.patch)
          echo "✅ SUSFS siap"

      - name: Enable KernelSU + SUSFS config
        run: |
          KROOT=${{ steps.detect.outputs.kroot }}
          CFG="kernel/$KROOT/arch/arm64/configs/$DEFCONFIG"
          cat >> "$CFG" <<EOF
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          EOF
          echo "✅ Config ditambahkan ke $CFG"

      - name: Build with build.sh
        if: steps.detect.outputs.has_build_sh == '1'
        run: |
          cd kernel
          chmod +x build.sh
          ./build.sh

      - name: Build with make
        if: steps.detect.outputs.has_build_sh != '1'
        run: |
          KROOT=${{ steps.detect.outputs.kroot }}
          cd "kernel/$KROOT"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
          make O=out "$DEFCONFIG"
          make O=out olddefconfig
          make O=out -j"$(nproc)"

      - name: Collect build artifacts
        run: |
          mkdir -p artifacts
          IMG=$(find kernel -path "*boot*" -name "Image*" ! -name "*.dtb" | head -n 1)
          echo "Image ditemukan: $IMG"
          cp "$IMG" artifacts/Image

      - name: Package AnyKernel3
        if: env.ANYKERNEL_REPO != ''
        run: |
          git clone --depth=1 "$ANYKERNEL_REPO" ak3
          cp artifacts/Image ak3/
          cd ak3
          zip -r9 "../artifacts/AnyKernel3-${DEVICE_NAME}-android12-5.10.zip" . -x ".git/*"

      - name: Generate build info
        run: |
          cat > artifacts/build-info.txt <<EOF
          Device      : $DEVICE_NAME
          Kernel      : android12-5.10-lts
          Branch      : $KERNEL_BRANCH
          KernelSU    : $KSU_BRANCH
          SUSFS       : $SUSFS_BRANCH
          Build date  : $(date -u)
          EOF
          cat artifacts/build-info.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-android12-5.10-${{ env.DEVICE_NAME }}
          path: artifacts/
          
