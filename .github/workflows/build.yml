name: Build Kernel (android12-5.10-lts)

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: "URL kernel source"
        required: true
        default: "https://github.com/yudharn/Kernel-Source"
      kernel_branch:
        description: "Branch kernel"
        required: true
        default: "android12-5.10-lts"
      build_method:
        description: "Metode build"
        required: true
        default: "auto"
        type: choice
        options:
          - auto        # Deteksi otomatis
          - build_sh    # build.sh (struktur GKI penuh: common/ + build/)
          - make        # make langsung (struktur kernel biasa)
      defconfig:
        description: "Defconfig (kosongkan untuk auto-detect gki_defconfig)"
        required: false
        default: ""
      clang_version:
        description: "Versi AOSP Clang"
        required: true
        default: "clang-r530567"
        type: choice
        options:
          - clang-r530567
          - clang-r487789
          - clang-r450784e
          - clang-r416183b
      enable_lto:
        description: "Aktifkan LTO=thin?"
        required: true
        default: true
        type: boolean
      enable_kernelsu:
        description: "Integrasi KernelSU?"
        required: true
        default: false
        type: boolean
      enable_susfs:
        description: "Integrasi SUSFS? (perlu KernelSU aktif)"
        required: true
        default: false
        type: boolean
      enable_anykernel3:
        description: "Pack AnyKernel3?"
        required: true
        default: false
        type: boolean
      upload_release:
        description: "Upload ke GitHub Release?"
        required: true
        default: false
        type: boolean

env:
  TZ: Asia/Jakarta
  CCACHE_COMPILERCHECK: "%compiler% -dumpmachine && %compiler% -dumpversion"
  CCACHE_MAXSIZE: 2G
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  ANYKERNEL3_URL: https://github.com/osm0sis/AnyKernel3.git

jobs:
  build:
    name: Build ${{ github.event.inputs.kernel_branch }}
    runs-on: ubuntu-latest
    env:
      KERNEL_DIR: ${{ github.workspace }}/kernel
      OUT_DIR: ${{ github.workspace }}/out
      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchain

    steps:
      # ══════════════════════════════════════════════
      # 1. Checkout kernel source
      # ══════════════════════════════════════════════
      - name: Checkout kernel source
        run: |
          echo "Cloning ${{ github.event.inputs.kernel_source }} (branch: ${{ github.event.inputs.kernel_branch }})..."
          git clone --depth=1 --single-branch \
            -b ${{ github.event.inputs.kernel_branch }} \
            ${{ github.event.inputs.kernel_source }} \
            $KERNEL_DIR

      # ══════════════════════════════════════════════
      # 2. Setup build environment
      # ══════════════════════════════════════════════
      - name: Setup build environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential ccache cpio curl flex git gnupg \
            libelf-dev libssl-dev lzip lz4 python3 python3-pip repo \
            rsync unzip zip zstd
          git config --global user.name  "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Baca versi kernel dari Makefile (common/ atau root)
          MAKEFILE="$KERNEL_DIR/Makefile"
          [ -f "$KERNEL_DIR/common/Makefile" ] && MAKEFILE="$KERNEL_DIR/common/Makefile"
          echo "KERNEL_VER=$(grep -m1 '^VERSION' $MAKEFILE | awk -F= '{print $2}' | xargs).$(grep -m1 '^PATCHLEVEL' $MAKEFILE | awk -F= '{print $2}' | xargs).$(grep -m1 '^SUBLEVEL' $MAKEFILE | awk -F= '{print $2}' | xargs)" >> $GITHUB_ENV
          echo "✅ Kernel version terdeteksi"

      # ══════════════════════════════════════════════
      # 3. Cache ccache (build berikutnya lebih cepat)
      # ══════════════════════════════════════════════
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.event.inputs.kernel_branch }}-${{ github.event.inputs.defconfig }}
          max-size: 2G

      # ══════════════════════════════════════════════
      # 4. Download AOSP Clang toolchain
      # ══════════════════════════════════════════════
      - name: Download toolchain
        run: |
          CLANG_VER="${{ github.event.inputs.clang_version }}"
          echo "Mengunduh $CLANG_VER..."
          mkdir -p $TOOLCHAIN_DIR/clang
          curl -sL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/${CLANG_VER}.tar.gz" \
            -o clang.tar.gz
          tar -xzf clang.tar.gz -C $TOOLCHAIN_DIR/clang
          rm -f clang.tar.gz
          echo "CLANG_BIN=$TOOLCHAIN_DIR/clang/bin" >> $GITHUB_ENV
          $TOOLCHAIN_DIR/clang/bin/clang --version | head -1

      # ══════════════════════════════════════════════
      # 5. Integrasi KernelSU (opsional)
      # ══════════════════════════════════════════════
      - name: Integrate KernelSU
        if: github.event.inputs.enable_kernelsu == 'true'
        working-directory: kernel
        run: |
          echo "Menerapkan KernelSU..."
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          # Patch masuk ke common/ (struktur GKI) atau root
          echo "✅ KernelSU siap"

      # ══════════════════════════════════════════════
      # 6. Integrasi SUSFS (opsional, butuh KernelSU)
      # ══════════════════════════════════════════════
      - name: Integrate SUSFS
        if: github.event.inputs.enable_susfs == 'true' && github.event.inputs.enable_kernelsu == 'true'
        working-directory: kernel
        run: |
          echo "Menerapkan SUSFS untuk android12-5.10..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 $GITHUB_WORKSPACE/susfs
          
          # Tentukan target patch (common/ atau root)
          TARGET="."
          [ -d "common" ] && TARGET="common"
          
          cp $GITHUB_WORKSPACE/susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./KernelSU/ 2>/dev/null || true
          cp $GITHUB_WORKSPACE/susfs/kernel_patches/50_add_susfs_in_kernel-5.10.patch $TARGET/
          cp $GITHUB_WORKSPACE/susfs/kernel_patches/fs/* $TARGET/fs/
          cp $GITHUB_WORKSPACE/susfs/kernel_patches/include/linux/* $TARGET/include/linux/
          
          cd ./KernelSU && patch -p1 < 10_enable_susfs_for_ksu.patch
          cd ../$TARGET && patch -p1 < 50_add_susfs_in_kernel-5.10.patch
          echo "✅ SUSFS siap"

      # ══════════════════════════════════════════════
      # 7. Deteksi metode build & defconfig
      # ══════════════════════════════════════════════
      - name: Detect build structure
        working-directory: kernel
        run: |
          METHOD="${{ github.event.inputs.build_method }}"
          echo "Struktur repo:"
          ls -1 | head -20
          
          if [ "$METHOD" == "auto" ]; then
            if [ -f "build/build.sh" ] && [ -f "common/build.config.gki.aarch64" ]; then
              METHOD="build_sh"
            else
              METHOD="make"
            fi
          fi
          echo "BUILD_METHOD=$METHOD" >> $GITHUB_ENV
          echo "🔧 Metode build: $METHOD"
          
          # Tentukan defconfig
          INPUT_DEF="${{ github.event.inputs.defconfig }}"
          if [ -n "$INPUT_DEF" ]; then
            DEFCONFIG="$INPUT_DEF"
          elif [ -f "common/arch/arm64/configs/gki_defconfig" ]; then
            DEFCONFIG="gki_defconfig"
          elif [ -f "arch/arm64/configs/gki_defconfig" ]; then
            DEFCONFIG="gki_defconfig"
          else
            DEFCONFIG=$(ls arch/arm64/configs/ 2>/dev/null | head -1)
          fi
          echo "DEFCONFIG=$DEFCONFIG" >> $GITHUB_ENV
          echo "📋 Defconfig: $DEFCONFIG"

      # ══════════════════════════════════════════════
      # 8A. Build dengan build.sh (struktur GKI penuh)
      # ══════════════════════════════════════════════
      - name: Build with build.sh
        if: env.BUILD_METHOD == 'build_sh'
        working-directory: kernel
        run: |
          export PATH="$CLANG_BIN:$PATH"
          LTO_FLAG=""
          [ "${{ github.event.inputs.enable_lto }}" == "true" ] && LTO_FLAG="LTO=thin"
          
          $LTO_FLAG BUILD_CONFIG=common/build.config.gki.aarch64 \
            build/build.sh 2>&1 | tee $GITHUB_WORKSPACE/build.log
          
          echo "DIST_DIR=$(find $GITHUB_WORKSPACE/out -name dist -type d | head -1)" >> $GITHUB_ENV

      # ══════════════════════════════════════════════
      # 8B. Build dengan make (struktur kernel biasa)
      # ══════════════════════════════════════════════
      - name: Build with make
        if: env.BUILD_METHOD == 'make'
        working-directory: kernel
        run: |
          export PATH="$CLANG_BIN:$PATH"
          
          # KernelSU config
          if [ "${{ github.event.inputs.enable_kernelsu }}" == "true" ]; then
            make O=$OUT_DIR ARCH=arm64 LLVM=1 LLVM_IAS=1 ${{ env.DEFCONFIG }}
            ./scripts/config --file $OUT_DIR/.config -e KSU
            [ "${{ github.event.inputs.enable_susfs }}" == "true" ] && ./scripts/config --file $OUT_DIR/.config -e KSU_SUSFS
            make O=$OUT_DIR ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          else
            make O=$OUT_DIR ARCH=arm64 LLVM=1 LLVM_IAS=1 ${{ env.DEFCONFIG }}
          fi
          
          make O=$OUT_DIR ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang LD=ld.lld \
            -j$(nproc) Image.gz dtb dtbo 2>&1 | tee $GITHUB_WORKSPACE/build.log
          
          echo "DIST_DIR=$OUT_DIR/arch/arm64/boot" >> $GITHUB_ENV

      # ══════════════════════════════════════════════
      # 9. Kumpulkan hasil build
      # ══════════════════════════════════════════════
      - name: Collect build artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          echo "Mencari hasil di $DIST_DIR ..."
          
          # Salin semua file penting
          for f in Image Image.gz Image.lz4 dtbo.img *.dtb; do
            find $DIST_DIR -name "$f" -exec cp -v {} $GITHUB_WORKSPACE/output/ \; 2>/dev/null || true
          done
          
          ls -lh $GITHUB_WORKSPACE/output/
          [ -z "$(ls -A $GITHUB_WORKSPACE/output)" ] && { echo "::error::Tidak ada hasil build!"; exit 1; }

      # ══════════════════════════════════════════════
      # 10. Packaging AnyKernel3 (opsional)
      # ══════════════════════════════════════════════
      - name: Package AnyKernel3
        if: github.event.inputs.enable_anykernel3 == 'true'
        run: |
          BUILD_TAG="Kernel-${{ github.event.inputs.kernel_branch }}-$(date +%Y%m%d-%H%M)"
          AK_DIR="$GITHUB_WORKSPACE/AnyKernel3"
          git clone --depth=1 $ANYKERNEL3_URL $AK_DIR
          cd $AK_DIR
          rm -rf .git .gitignore README.md LICENSE *.sh modules ramdisk
          
          cp $GITHUB_WORKSPACE/output/Image.gz ./ 2>/dev/null || cp $GITHUB_WORKSPACE/output/Image ./
          cp $GITHUB_WORKSPACE/output/dtbo.img ./ 2>/dev/null || true
          cat $GITHUB_WORKSPACE/output/*.dtb > ./dtb 2>/dev/null || true
          
          sed -i "s/kernel.string=.*/kernel.string=Custom Kernel ${{ github.event.inputs.kernel_branch }}/" anykernel.sh
          sed -i "s/do.devicecheck=.*/do.devicecheck=0/" anykernel.sh
          
          zip -r9 "$BUILD_TAG.zip" . -x "*.git*"
          mv "$BUILD_TAG.zip" $GITHUB_WORKSPACE/output/

      # ══════════════════════════════════════════════
      # 11. Generate build info
      # ══════════════════════════════════════════════
      - name: Generate build info
        run: |
          cat > $GITHUB_WORKSPACE/output/BUILD_INFO.md << EOF
          # Kernel Build Info
          - **Source:** ${{ github.event.inputs.kernel_source }}
          - **Branch:** ${{ github.event.inputs.kernel_branch }}
          - **Kernel:** ${KERNEL_VER}
          - **Metode build:** ${{ env.BUILD_METHOD }}
          - **Defconfig:** ${{ env.DEFCONFIG }}
          - **Toolchain:** ${{ github.event.inputs.clang_version }}
          - **LTO:** ${{ github.event.inputs.enable_lto }}
          - **KernelSU:** ${{ github.event.inputs.enable_kernelsu }}
          - **SUSFS:** ${{ github.event.inputs.enable_susfs }}
          - **Build date:** $(date '+%Y-%m-%d %H:%M:%S %Z')
          - **Built by:** @${{ github.actor }}
          EOF

      # ══════════════════════════════════════════════
      # 12. Upload artifacts
      # ══════════════════════════════════════════════
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ github.event.inputs.kernel_branch }}-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/output/*
            ${{ github.workspace }}/build.log
          retention-days: 30

      # ══════════════════════════════════════════════
      # 13. Upload ke GitHub Release (opsional)
      # ══════════════════════════════════════════════
      - name: Create Release
        if: github.event.inputs.upload_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Kernel Build #${{ github.run_number }}
          body_path: ${{ github.workspace }}/output/BUILD_INFO.md
          prerelease: true
          files: ${{ github.workspace }}/output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ══════════════════════════════════════════════
      # 14. Ringkasan build
      # ══════════════════════════════════════════════
      - name: Build summary
        if: always()
        run: |
          echo "## 🔧 Kernel Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Nilai |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.event.inputs.kernel_branch }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Kernel | ${KERNEL_VER} |" >> $GITHUB_STEP_SUMMARY
          echo "| Metode | ${{ env.BUILD_METHOD }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Toolchain | ${{ github.event.inputs.clang_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          
