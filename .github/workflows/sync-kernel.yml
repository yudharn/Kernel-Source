name: Sync Kernel Source

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo kamu (full history)
        run: |
          git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/yudharn/Kernel-Source.git repo-kamu
          cd repo-kamu
          git config user.email "you@example.com"
          git config user.name "yudharn"

      - name: Simpan semua perubahan lokal sejak sync terakhir
        run: |
          cd repo-kamu
          mkdir -p /tmp/patches-backup
          if git ls-remote --exit-code --heads origin android12-5.10-lts >/dev/null 2>&1; then
            git checkout android12-5.10-lts
            BASE=$(git rev-list --max-parents=0 HEAD | tail -1)
            git format-patch "$BASE"..HEAD -o /tmp/patches-backup/ || true
            echo "Base sebelumnya: $BASE"
            echo "Perubahan lokal ditemukan: $(ls /tmp/patches-backup | wc -l) commit"
          else
            echo "Branch belum ada di remote, tidak ada yang perlu disimpan."
          fi

      - name: Ambil source terbaru dari upstream
        run: |
          cd repo-kamu
          git remote add upstream https://android.googlesource.com/kernel/common
          git fetch --depth=1 upstream android12-5.10-lts

      - name: Buat base baru dari upstream
        run: |
          cd repo-kamu
          git checkout --orphan sync-temp upstream/android12-5.10-lts
          git add -A
          git commit -m "Base sync dari upstream android12-5.10-lts"

      - name: Terapkan ulang semua perubahan lokal
        run: |
          cd repo-kamu
          shopt -s nullglob
          PATCHES=(/tmp/patches-backup/*.patch)
          if [ ${#PATCHES[@]} -gt 0 ]; then
            for patch in "${PATCHES[@]}"; do
              echo "Menerapkan $(basename "$patch") ..."
              if ! git am "$patch"; then
                echo "::error::Gagal menerapkan $(basename "$patch") — bentrok dengan source upstream terbaru. Sync dibatalkan, repo lama TIDAK berubah."
                git am --abort
                exit 1
              fi
            done
          else
            echo "Tidak ada perubahan lokal untuk diterapkan ulang."
          fi

      - name: Push hasil sync
        run: |
          cd repo-kamu
          git branch -D android12-5.10-lts || true
          git branch -m android12-5.10-lts
          git push --force https://x-access-token:${{ secrets.GH_PAT }}@github.com/yudharn/Kernel-Source.git android12-5.10-lts
